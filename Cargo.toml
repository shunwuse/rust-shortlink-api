[package]
name = "rust-shortlink-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
